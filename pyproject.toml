[project]
name = "investmentresearchassistant-mcp"
version = "0.1.0"
description = "AI investment research assistant: Streamlit UI + LangGraph agent over a FastMCP finance server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.7",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "pyjwt>=2.10.1",
    "streamlit>=1.62.0",
    "yfinance>=1.7.0",
]
